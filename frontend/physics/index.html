<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理讲题编译器</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="physics.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="../">教育智能体</a>
  <span class="nav"><a href="../read/">阅读</a><a class="on" href="./">物理</a></span>
</div>

<div class="wrap">
  <section class="card section">
    <h2>题目或描述</h2>
    <textarea id="input" rows="4" placeholder="质量 m=1kg 的物块从倾角 37°、长 2m 的斜面顶端由静止下滑……"></textarea>
    <div class="row">
      <button class="btn" id="build">生成演示</button>
      <span class="muted">只支持：单物块 · 斜面 + 水平传送带</span>
    </div>
  </section>

  <section id="result"></section>
</div>

<script src="../blocks.js"></script>
<script src="canvas.js"></script>
<script src="physics.js"></script>
</body>
</html>
